services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comanda
      POSTGRES_USER: comanda
      POSTGRES_PASSWORD: comanda
    ports:
      - "5432:5432"
    volumes:
      - comanda-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comanda -d comanda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  comanda-postgres: